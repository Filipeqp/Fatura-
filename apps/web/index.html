<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Fatura+ — Organizador de Faturas</title>
    <meta
      name="description"
      content="Organize os itens da sua fatura de cartão de crédito, categorize gastos automaticamente e acompanhe sua evolução mês a mês."
    />
    <script>
      (function () {
        var stored = localStorage.getItem("fatura-plus-theme");
        var theme = stored === "light" ? "light" : "dark";
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
